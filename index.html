<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twenty-Nine — PyScript Demo</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Georgia, 'Times New Roman', serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #07101d, #14253f);
      color: #f9f1d0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: min(92vw, 760px);
      background: rgba(10, 18, 32, 0.92);
      border: 1px solid #f5b942;
      border-radius: 20px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.35);
      padding: 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      color: #ffd76a;
    }
    p {
      margin: 0 0 16px;
      color: #d6d9e0;
      line-height: 1.6;
    }
    button {
      background: #f5b942;
      color: #111;
      border: none;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 16px;
    }
    button:hover {
      transform: translateY(-1px);
    }
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }
    .chip {
      padding: 12px 14px;
      border-radius: 12px;
      background: linear-gradient(145deg, #1a2c48, #102032);
      border: 1px solid #4f5f7b;
      min-width: 88px;
      text-align: center;
      font-size: 1.05rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Twenty-Nine</h1>
    <p>This page runs Python directly in the browser with PyScript. The deck logic is handled by Python and rendered here.</p>
    <button id="shuffle-btn">Shuffle Cards</button>
    <div id="status">Loading Python…</div>
    <div class="cards" id="cards"></div>
  </main>

  <script type="py" src="./game_browser.py" async></script>
  <script type="text/javascript">
    const status = document.getElementById("status");
    const cards = document.getElementById("cards");
    const button = document.getElementById("shuffle-btn");

    function renderDemo() {
      if (!window.pyodide || !window.pyodide.globals) {
        return;
      }
      try {
        const intro = window.pyodide.globals.get("build_intro")();
        const cardsList = window.pyodide.globals.get("shuffle_cards")(4);
        const title = intro.get("title");
        const subtitle = intro.get("subtitle");
        status.innerHTML = `<strong>${title}</strong> — ${subtitle}`;
        cards.innerHTML = cardsList.toJs().map((card) => `<div class="chip">${card}</div>`).join("");
      } catch (error) {
        status.textContent = "Python loaded, but the demo could not render.";
        console.error(error);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      button.addEventListener("click", renderDemo);
      window.addEventListener("py:ready", renderDemo, { once: true });
      setTimeout(renderDemo, 800);
    });
  </script>
</body>
</html>
